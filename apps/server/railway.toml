[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
# Allow in-flight streaming requests to finish before stopping the old process.
drainingSeconds = 300
startCommand = "python scripts/start_api.py"

[deploy.healthcheck]
path = "/health/ready"
intervalSeconds = 30
timeoutSeconds = 10
restartLimit = 3

# 上传文件持久化（素材上传、问题反馈截图等）
# 挂载到 /app/uploads 后，可直接复用现有默认上传目录配置
[[deploy.volumes]]
name = "uploads-data"
mountTo = "/app/uploads"
